<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Ansök: formulär som skickar sig självt</title>
</head>
<body>
  <form id="application" method="get" action="">
    <label for="first">Förnamn</label>
    <input id="first" name="first_name" type="text" onchange="this.form.submit()">

    <label for="email">E-post</label>
    <input id="email" name="email" type="email" oninput="this.form.requestSubmit()">
  </form>
  <script>
    window.__submitted = false;
    document.getElementById("application").onsubmit = function () {
      window.__submitted = true;
    };
  </script>
</body>
</html>
