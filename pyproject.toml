[project]
name = "jobaplier"
version = "0.1.0"
description = "Lokal tjänst som hittar jobb som matchar ditt CV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "sqlmodel",
    "apscheduler>=3.10,<4",
    "httpx",
    "selectolax",
    "pypdf",
    "weasyprint",
    "playwright",
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-playwright",
]

[project.scripts]
jobaplier = "jobaplier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobaplier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
